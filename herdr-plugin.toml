id = "wrapped-agent"
name = "Wrapped Agent"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Detect coding agents running inside docker exec sessions"
platforms = ["linux"]

# Start the background daemon when the herdr server comes up.
[[startup]]
command = ["python3", "wrapped_agent.py", "ensure"]

# Cheap safety net: make sure the daemon runs whenever a pane is created
# (covers linking the plugin into an already-running server).
[[events]]
on = "pane.created"
command = ["python3", "wrapped_agent.py", "ensure"]

[[actions]]
id = "start"
title = "Wrapped agent: start daemon"
contexts = ["workspace"]
command = ["python3", "wrapped_agent.py", "ensure"]

[[actions]]
id = "stop"
title = "Wrapped agent: stop daemon"
contexts = ["workspace"]
command = ["python3", "wrapped_agent.py", "stop"]

[[actions]]
id = "status"
title = "Wrapped agent: status"
contexts = ["workspace"]
command = ["python3", "wrapped_agent.py", "status"]
